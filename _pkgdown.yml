  bslib:
    primary: "#036684"
  includes:
    in_header: |
      <script defer data-domain="jessesadler.github.io/debkeepr" src="https://plausible.io/js/script.js"></script>
authors:
  Jesse Sadler:
    href: https://www.jessesadler.com

development:
  mode: release

reference:
  - title: debkeepr types
    contents:
    - deb_lsd
    - deb_is_lsd
    - deb_as_lsd
    - deb_tetra
    - deb_is_tetra
    - deb_as_tetra
    - deb_decimal
    - deb_is_decimal
    - deb_as_decimal
    - deb_as_list
    - deb_text
    - debkeepr
  - title: Normalization
    contents:
    - deb_normalize
  - title: Conversion
    contents:
    - deb_convert_bases
    - deb_convert_unit
  - title: Math
    contents:
    - mathematics
  - title: Analysis of double-entry bookkeeping
    contents:
    - deb_account
    - deb_account_summary
    - deb_credit
    - deb_debit
    - deb_current
    - deb_open
    - deb_balance
  - title: Data frame helpers for deb_lsd and deb_tetra types
    contents:
    - deb_gather_lsd
    - deb_spread_lsd
    - deb_gather_tetra
    - deb_spread_tetra
  - title: Data
    contents:
    - dafforne_accounts
    - dafforne_transactions
